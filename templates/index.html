<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANGUARD | SITE AUDITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', monospace; }
        .border-neon { border: 1px solid #00ff41; box-shadow: 0 0 10px #00ff41; }
        .btn:hover { background-color: #00ff41; color: black; cursor: pointer; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-2xl w-full">
        <h1 class="text-4xl font-bold text-center mb-2">VANGUARD ENGINE</h1>
        <p class="text-center text-xs mb-8 text-gray-500">WEB PERFORMANCE & SECURITY INTERCEPTOR</p>

        <div class="border-neon p-6 rounded bg-black">
            <label class="text-xs uppercase">Target URL:</label>
            <div class="flex gap-2 mt-2">
                <input type="text" id="url" placeholder="example.com" class="w-full bg-gray-900 border border-gray-700 p-3 text-white focus:outline-none focus:border-green-500">
                <button onclick="runAudit()" class="border-neon px-6 py-3 font-bold btn">SCAN</button>
            </div>
        </div>

        <div id="loading" class="hidden text-center mt-8 animate-pulse">
            [ INITIALIZING SCANNER... ]
        </div>

        <div id="results" class="hidden mt-8 border-neon p-6 rounded bg-black/80">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
                <h2 class="text-xl font-bold" id="domain">TARGET ACQUIRED</h2>
                <div class="text-3xl font-black" id="score">0/100</div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-6 text-center">
                <div class="p-2 border border-gray-800 rounded">
                    <p class="text-xs text-gray-500">SPEED</p>
                    <p class="font-bold" id="speed">0s</p>
                </div>
                <div class="p-2 border border-gray-800 rounded">
                    <p class="text-xs text-gray-500">SSL</p>
                    <p class="font-bold" id="ssl">CHECKING</p>
                </div>
                <div class="p-2 border border-gray-800 rounded">
                    <p class="text-xs text-gray-500">SEO</p>
                    <p class="font-bold" id="seo">CHECKING</p>
                </div>
            </div>

            <h3 class="text-red-500 font-bold mb-2">VULNERABILITIES:</h3>
            <ul id="issues" class="text-sm text-red-400 list-disc pl-5 mb-6 space-y-1"></ul>

            <div class="bg-gray-900 p-4 rounded border border-gray-700">
                <p class="text-xs text-gray-500 mb-2">GENERATED CLIENT EMAIL (COPY & SEND):</p>
                <textarea id="pitch" class="w-full h-32 bg-black text-white text-xs p-2 border border-gray-800" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        async function runAudit() {
            const url = document.getElementById('url').value;
            if(!url) return;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const res = await fetch('/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                const data = await res.json();

                document.getElementById('domain').innerText = data.domain;
                document.getElementById('score').innerText = data.score + "/100";
                document.getElementById('score').className = data.score > 80 ? "text-3xl font-black text-green-500" : "text-3xl font-black text-red-500";
                
                document.getElementById('speed').innerText = data.speed + "s";
                document.getElementById('ssl').innerText = data.ssl ? "SECURE" : "UNSAFE";
                document.getElementById('seo').innerText = data.seo ? "GOOD" : "MISSING";
                
                const list = document.getElementById('issues');
                list.innerHTML = "";
                data.issues.forEach(i => {
                    let li = document.createElement('li');
                    li.innerText = i;
                    list.appendChild(li);
                });

                document.getElementById('pitch').value = data.pitch;
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('results').classList.remove('hidden');
            } catch(e) {
                alert("Scan Failed. Check URL.");
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>

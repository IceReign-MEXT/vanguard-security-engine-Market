<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VANGUARD COMMAND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', monospace; }
        .border-neon { border: 1px solid #00ff41; box-shadow: 0 0 10px #00ff41; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between border-b border-green-500 pb-4 mb-8">
            <h1 class="text-3xl font-bold">VANGUARD SECURITY</h1>
            <div class="text-right">
                <p>STATUS: <span class="text-white font-bold">ONLINE</span></p>
                <p>DB LINK: ENCRYPTED</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-black border-neon p-6">
                <h3 class="text-white text-sm">TOTAL SCANS</h3>
                <p class="text-4xl font-bold mt-2">{{ total }}</p>
            </div>
            <div class="bg-black border-neon p-6">
                <h3 class="text-red-500 text-sm">THREATS DETECTED</h3>
                <p class="text-4xl font-bold mt-2 text-red-500">{{ threats }}</p>
            </div>
        </div>

        <div class="bg-black/90 border-neon p-6">
            <h3 class="text-white mb-4">📡 LIVE VULNERABILITY FEED</h3>
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="text-gray-500 border-b border-gray-800"><th class="py-2">TARGET</th><th>ISSUES</th><th>FIX VALUE</th><th>STATUS</th></tr>
                </thead>
                <tbody>
                    {% for scan in scans %}
                    <tr class="border-b border-gray-900">
                        <td class="py-3 text-white">{{ scan[0] }}</td>
                        <td class="py-3">{{ scan[1] }}</td>
                        <td class="py-3 font-bold">${{ scan[2] }}</td>
                        <td class="py-3 {{ 'text-red-500' if 'CRITICAL' in scan[3] else 'text-green-500' }}">{{ scan[3] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
